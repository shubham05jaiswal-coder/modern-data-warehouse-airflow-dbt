version: 2
models:
  - name: dim_customers
    description: Clean customer dimension for reporting.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
  - name: dim_products
    description: Product dimension with standardized category and price.
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
  - name: fct_orders
    description: Order-grain fact table with customer and product attributes.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
  - name: mart_daily_sales
    description: Daily sales KPIs based on completed orders.
    columns:
      - name: order_date
        tests:
          - unique
          - not_null
